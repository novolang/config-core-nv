[package]
name        = "config-core-nv"
version     = "0.1.0"
description = "The merge algebra of a layered configuration: one value tree, layers with a precedence, deep-merging tables and replacing arrays, dotted-path lookup whose refusals carry a reason and a layer, environment-variable key mapping as a pure function, and a provenance answer for every key. No file, no environment, no clock."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet; config-nv is the first consumer.
stability   = "experimental"

# `core`.  Everything here is arithmetic over a tree the caller already
# holds: merging two layers, walking a dotted path, turning a list of
# `(name, value)` pairs into a layer.  Nothing is read and nothing is
# written.  The half that opens a file, reads the process environment
# and parses a `.env` is `config-nv`, which depends on this one.
#
# `tests/embedded_probe.nv` builds every module but `cfgenvkeys` for a
# Cortex-M4 and checks six answers on it under QEMU.  Those modules are
# `@tier(rt)`: the tree needs the device's heap.
layer       = "core"

category    = "tooling"

tags        = ["config", "configuration", "layered", "merge", "dotenv", "figment", "precedence"]
repository  = "https://github.com/novolang/config-core-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain whose device runtime carries
# `str.to_int` and `str.from_byte`, which the bodies use.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Layering configuration values that are already parsed"

[dependencies]
# None, and the choice is argued in the README under "How a TomlValue
# gets in".  Depending on toml-nv and yaml-nv to carry three adapter
# functions would put two parsers and calendar-nv in the closure of
# every consumer that only wanted to merge two tables; the adapters live
# in `config-nv`, which needs those parsers anyway.
